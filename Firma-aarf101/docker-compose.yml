version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: firma-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: firma
    volumes:
      - mongodb_data:/data/db
    networks:
      - firma-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Java Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firma-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/firma
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - firma-network

  # Angular Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firma-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      API_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - firma-network

volumes:
  mongodb_data:

networks:
  firma-network:
    driver: bridge
